<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Stock Opname Mandiri (SOM)</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="css/styles.css">
  
  <!-- Barcode Engine Libraries -->
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@ericblade/quagga2/dist/quagga.min.js"></script>
</head>
<body>

  <!-- Header -->
  <header>
    <div class="brand">SOM System</div>
    <div style="display: flex; gap: 8px; align-items: center;">
      <span id="pending-count" style="font-size: 0.75rem; font-weight: 700; color: var(--accent-warning);"></span>
      <span id="network-badge" class="status-pill">Checking...</span>
    </div>
  </header>

  <!-- Main Container -->
  <main class="app-container">
    
    <!-- Card Scanner & Input -->
    <div class="card">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
        <h3 style="font-size: 1rem;">Input Stock Opname</h3>
        <select id="select-engine" onchange="switchEngine(this.value)" style="padding: 4px 8px; border-radius: 6px;">
          <option value="HTML5">Engine: HTML5</option>
          <option value="Quagga">Engine: Quagga2</option>
        </select>
      </div>

      <!-- Scanner Viewfinder -->
      <div id="scanner-viewfinder"></div>

      <div class="input-group" style="margin-top: 16px;">
        <label>Lokasi SO</label>
        <input type="text" id="input-lokasi" class="input-field" placeholder="Contoh: A-01-02" value="A-01">
      </div>

      <div class="input-group">
        <label>Kode UPC / Artikel Barcode</label>
        <div style="display: flex; gap: 8px;">
          <input type="text" id="input-barcode" class="input-field" placeholder="Scan atau Ketik Barcode">
          <button class="btn btn-secondary" style="width: auto; padding: 0 16px;" onclick="triggerManualSearch()">Cari</button>
        </div>
      </div>

      <!-- Info Produk (Muncul jika terdeteksi) -->
      <div id="product-info-box" style="display:none; background: #F3F4F6; padding: 12px; border-radius: 8px; margin-bottom: 16px; font-size: 0.85rem;">
        <div id="info-deskripsi" style="font-weight: 700;"></div>
        <div id="info-dept-brand" style="color: var(--text-muted);"></div>
      </div>

      <div style="display: flex; gap: 12px;">
        <div class="input-group" style="flex: 1;">
          <label>Jumlah (Qty)</label>
          <input type="number" id="input-qty" class="input-field" placeholder="0" inputmode="numeric">
        </div>
        <div class="input-group" style="flex: 1.5;">
          <label>Keterangan (Opsional)</label>
          <input type="text" id="input-ket" class="input-field" placeholder="Catatan">
        </div>
      </div>

      <button class="btn btn-primary" onclick="processSaveSO('NEW')">Simpan SO</button>
    </div>

  </main>

  <!-- Toast Notification -->
  <div id="toast-notification" style="display:none; position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%); background: #111827; color: white; padding: 10px 20px; border-radius: 20px; font-size: 0.85rem; z-index: 99;"></div>

  <!-- Modal Custom -->
  <div id="custom-modal" class="modal-overlay">
    <div class="modal-box">
      <div id="modal-title" class="modal-title">Judul</div>
      <div id="modal-body" class="modal-body">Pesan konfirmasi...</div>
      <div class="modal-actions">
        <button class="btn btn-secondary" onclick="closeModal()">Tutup</button>
        <button id="modal-confirm-btn" class="btn btn-primary">Lanjutkan</button>
      </div>
    </div>
  </div>

  <!-- Bottom Nav -->
  <nav class="bottom-nav">
    <button class="nav-item active">
      <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
      Home
    </button>
    <button class="nav-item">
      <svg viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-2 10h-4v4h-2v-4H7v-2h4V7h2v4h4v2z"/></svg>
      Input SO
    </button>
    <button class="nav-item">
      <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/></svg>
      Verifikasi
    </button>
    <button class="nav-item">
      <svg viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-5 14H7v-2h7v2zm3-4H7v-2h10v2zm0-4H7V7h10v2z"/></svg>
      Report
    </button>
  </nav>

  <!-- Script Modules -->
  <script src="js/db.js"></script>
  <script src="js/api.js"></script>
  <script src="js/scanner.js"></script>
  <script src="js/sync.js"></script>
  <script src="js/app.js"></script>
  
  <script>
    // Inisialisasi Scanner Default pas load
    window.onload = () => {
      initScanner('HTML5', 'scanner-viewfinder', (scannedCode) => {
        document.getElementById('input-barcode').value = scannedCode;
        triggerManualSearch();
      });
    };

    function switchEngine(engine) {
      stopScanner();
      initScanner(engine, 'scanner-viewfinder', (scannedCode) => {
        document.getElementById('input-barcode').value = scannedCode;
        triggerManualSearch();
      });
    }

    async function triggerManualSearch() {
      const code = document.getElementById('input-barcode').value.trim();
      if (!code) return;
      const item = await searchOfflineMaster(code);
      const infoBox = document.getElementById('product-info-box');
      
      if (item) {
        document.getElementById('info-deskripsi').textContent = item['Deskripsi Produk'];
        document.getElementById('info-dept-brand').textContent = `${item['Department']} | ${item['Brand (Description)']}`;
        infoBox.style.display = 'block';
      } else {
        document.getElementById('info-deskripsi').textContent = "⚠ PRODUK TIDAK TERDAFTAR (UNKNOWN)";
        document.getElementById('info-dept-brand').textContent = "Item tetap dapat disimpan ke database";
        infoBox.style.display = 'block';
      }
      
      // Auto focus ke Qty setelah scan
      document.getElementById('input-qty').focus();
    }
  </script>
</body>
</html>
